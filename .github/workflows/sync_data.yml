name: Sync Civic Budget Data (SICONFI)

on:
  schedule:
    # Runs at 04:00 UTC on the 5th day of every month
    - cron: '0 4 5 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'SICONFI Fiscal Year to query'
        required: false
        default: '2023'
      skip_network:
        description: 'Skip network and regenerate static seed assets'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-siconfi:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run SICONFI Extraction Pipeline
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.skip_network }}" = "true" ]; then
            EXTRA_ARGS="--skip-network"
          fi
          YEAR="${{ github.event.inputs.year || '2023' }}"
          python pipeline/extract_siconfi.py --year "$YEAR" $EXTRA_ARGS

      - name: Check for data changes
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain public/data)" ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated budget data
        if: steps.git-check.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "chore(data): monthly siconfi sync - $(date +'%Y-%m') [skip ci]"
          git push
