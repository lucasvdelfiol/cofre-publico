name: Sync Civic Budget Data (SICONFI)

# The monthly refresh is run locally (see README) because a cold national
# extraction takes ~3h and GitHub-hosted runners cap a job at 6h while their
# response cache is evicted after 7 days without use. This workflow is kept as
# a manual fallback only.
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'SICONFI fiscal year to query'
        required: false
        default: '2025'
      history:
        description: 'Also refresh the 5-year historical series (slower)'
        required: false
        type: boolean
        default: true
      skip_network:
        description: 'Rebuild outputs from the local cache only'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-siconfi:
    runs-on: ubuntu-latest
    # Cold runs are ~3h locally but can exceed this limit on a 2 vCPU runner.
    # Prefer running the pipeline locally; see "Atualização de Dados" in README.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore SICONFI response cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: siconfi-cache-${{ github.run_id }}
          restore-keys: |
            siconfi-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run SICONFI Extraction Pipeline
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.skip_network }}" = "true" ]; then
            EXTRA_ARGS="--skip-network"
          fi
          if [ "${{ github.event.inputs.history }}" = "false" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-history"
          fi
          YEAR="${{ github.event.inputs.year || '2025' }}"
          python pipeline/extract_siconfi.py \
            --target-year "$YEAR" \
            --rate 4 \
            --workers 6 \
            $EXTRA_ARGS

      - name: Check for data changes
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain public/data)" ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated budget data
        if: steps.git-check.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "chore(data): siconfi sync - $(date +'%Y-%m') [skip ci]"
          git push
